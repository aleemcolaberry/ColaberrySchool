<body class="cbsite">

<script src="../../assets/vendor/lucide.min.js"></script>
<script src="../../assets/vendor/react.production.min.js"></script>

<script type="text/babel" src="program-enroll.jsx?v=fcca2493"></script>
<script type="text/babel">
  const { Header, Footer, HomeView, ProgramView, EnrollView } = window;
  function App() {
    const [view, setView] = React.useState('home');
    const go = (v) => { setView(v); window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' }); };
    React.useEffect(() => {
      if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
    });
    const View = view === 'program' ? ProgramView : view === 'enroll' ? EnrollView : HomeView;
    return (
      <React.Fragment>
        <Header go={go} current={view} />
        <View key={view} go={go} />
        <Footer go={go} />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
